<svg xmlns="http://www.w3.org/2000/svg" viewBox="-60 -252 1117 1191" role="img" aria-label="KuroNexus">
<!-- KuroNexus muhru. Glif dis hatlara cevrildi (Yuji Boku, OFL).
     Parilti SVG filtresiyle GOMULU: tarayicida birebir sitedeki gibi cizilir.
     UYARI: Figma/Illustrator SVG filtrelerini yok sayar ya da eksik cizer —
     tasarim araclarina almak icin filtresiz surumu kullanin. -->
  <title>KuroNexus</title>
  <defs>
  <filter id="parilti" x="-50%" y="-50%" width="200%" height="200%"
          color-interpolation-filters="sRGB">
    <!-- Uzak ve yumusak hale: sitedeki 18px'lik ikinci drop-shadow -->
    <feGaussianBlur in="SourceAlpha" stdDeviation="57.7" result="u"/>
    <feFlood flood-color="#b08d57" flood-opacity="0.26"/>
    <feComposite in2="u" operator="in" result="uzak"/>
    <!-- Yakin ve siki isik: kenari ayiran 3px'lik birinci drop-shadow -->
    <feGaussianBlur in="SourceAlpha" stdDeviation="9.6" result="y"/>
    <feFlood flood-color="#b08d57" flood-opacity="0.30"/>
    <feComposite in2="y" operator="in" result="yakin"/>
    <feMerge>
      <feMergeNode in="uzak"/><feMergeNode in="yakin"/><feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  </defs>
